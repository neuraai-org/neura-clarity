services:
  postgres:
    image: postgres:16-alpine
    container_name: weekly-clarity-postgres
    environment:
      POSTGRES_DB: weekly_clarity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: weekly-clarity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: weekly-clarity-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weekly_clarity
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: weekly-clarity-frontend
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    ports:
      - "3001:3001"

  workers:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: weekly-clarity-workers
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/weekly_clarity
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  pg_data:
  redis_data:
